# Dependency policy, checked in CI by cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Run locally with: cargo deny check

[graph]
# Check what ships on every platform we build for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerability and unsoundness advisories fail anywhere in the tree, as do
# yanked crates. "Unmaintained" notices fail only for crates we depend on
# directly: deeper ones (e.g. inside iced's renderer) we can't replace, and
# they get fixed by upgrading the crate that pulls them in. If an advisory
# needs an exception, add it to `ignore` with a comment saying why.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses compatible with shipping Cryptdeck as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft: fine to ship unmodified in a binary, but
# allowed per crate so a new MPL dependency gets noticed.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own crates depend on each other by path; they aren't published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
