# Third-party license notices, generated by cargo-about
# (https://embarkstudios.github.io/cargo-about/). The release builds run
#   cargo about generate --locked --fail packaging/about.hbs -o THIRD-PARTY-LICENSES.html
# and ship the file with every download. Keep `accepted` in step with
# deny.toml, which is what actually enforces the policy.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]

# Everything that ships on any platform, so one file covers all downloads.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Our own crates are listed separately (LICENSE-MIT, LICENSE-APACHE).
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
