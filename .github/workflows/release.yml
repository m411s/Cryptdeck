name: Release

# Builds every platform and publishes a GitHub Release when:
# - another workflow calls it with a version (see bump-version.yml and
#   auto-release.yml),
# - you run it from the Actions tab on main and enter a version (it creates
#   the tag v<version> itself), or
# - you push a tag like v0.2.0.
# Manual runs without a version, and pushes that touch packaging, do a dry
# run: the same builds, uploaded as workflow artifacts, nothing published.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # Not evaluated for tag pushes, so tags always build.
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "assets/**"
      - "crates/cryptdeck-gui/build.rs"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 0.2.0 (must match Cargo.toml). Leave empty
          for a test build that publishes nothing.
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        description: Commit to build and tag (defaults to the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: v
        env:
          # Passed through the environment, never pasted into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cryptdeck") | .version')

          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
          elif [[ -n "$INPUT_VERSION" ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] \
              || fail "Releases can only be made from main (this run is on $GITHUB_REF_NAME)"
            tag="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              fail "Tag $tag already exists. Bump the version in Cargo.toml first."
            fi
          fi

          if [[ -n "$tag" ]]; then
            [[ "$tag" == "v$cargo_version" ]] \
              || fail "Version $tag doesn't match Cargo.toml ($cargo_version)"
            if ! grep -q "<release version=\"$cargo_version\"" \
                packaging/flatpak/io.github.m411s.Cryptdeck.metainfo.xml; then
              echo "::warning::No <release> entry for $cargo_version in the Flatpak metainfo"
            fi
            {
              echo "version=$cargo_version"
              echo "tag=$tag"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version=$cargo_version-dev.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older distributions
    # (it links against the runner's glibc).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p cryptdeck
      - name: AppImage
        # To pin appimagetool and the runtime, set APPIMAGETOOL_URL,
        # APPIMAGETOOL_SHA256, APPIMAGE_RUNTIME_URL and APPIMAGE_RUNTIME_SHA256
        # here (see packaging/linux/build-appimage.sh). Each build logs the
        # checksums of what it downloaded.
        run: packaging/linux/build-appimage.sh target/release/cryptdeck "$VERSION" dist
      - name: Tarball
        run: |
          name="cryptdeck-$VERSION-linux-x86_64"
          mkdir -p "staging/$name"
          cp target/release/cryptdeck README.md LICENSE-MIT LICENSE-APACHE \
             packaging/linux/cryptdeck.desktop assets/cryptdeck.png "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Universal binary (Apple Silicon + Intel)
        run: |
          cargo build --release --locked -p cryptdeck --target aarch64-apple-darwin
          cargo build --release --locked -p cryptdeck --target x86_64-apple-darwin
          lipo -create -output cryptdeck \
            target/aarch64-apple-darwin/release/cryptdeck \
            target/x86_64-apple-darwin/release/cryptdeck
      - run: packaging/macos/build-dmg.sh cryptdeck "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p cryptdeck
      - name: Zip
        shell: pwsh
        run: |
          $name = "Cryptdeck-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "staging/$name", dist | Out-Null
          Copy-Item target/release/cryptdeck.exe, README.md, LICENSE-MIT, LICENSE-APACHE "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  flatpak-sources:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Turn Cargo.lock into a list of crate downloads, so the Flatpak build
      # runs offline (as on Flathub). Tool pinned by commit and checksum.
      - name: Vendor crates
        env:
          GEN_COMMIT: 9d86d336a39b9af38b86f114b6ce5820fe260f91
          GEN_SHA256: 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380
        run: |
          python3 -m pip install --user --quiet tomlkit aiohttp
          curl -fsSL --retry 5 -o gen.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$GEN_COMMIT/cargo/flatpak-cargo-generator.py"
          echo "$GEN_SHA256  gen.py" | sha256sum -c -
          python3 gen.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-cargo-sources
          path: cargo-sources.json

  flatpak:
    needs: [version, flatpak-sources]
    runs-on: ubuntu-latest
    container:
      # Flathub's build image for the freedesktop 25.08 runtime.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: packaging/flatpak/io.github.m411s.Cryptdeck.yml
          bundle: Cryptdeck-${{ needs.version.outputs.version }}-x86_64.flatpak
          # No build cache: a restored cache breaks runtime updates
          # ("Invalid cross-device link"), and releases are rare enough
          # that a clean build is worth the few extra minutes.
          cache: false
          restore-cache: false
          upload-artifact: false
      - run: mkdir -p dist && mv Cryptdeck-*.flatpak dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/*

  publish:
    if: needs.version.outputs.publish == 'true'
    needs: [version, linux, macos, windows, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          # Build input for the Flatpak, not a download.
          rm -f dist/cargo-sources.json
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Creates the tag on this commit when it doesn't exist yet.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: Cryptdeck ${{ needs.version.outputs.version }}
          files: dist/*
          body_path: packaging/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
