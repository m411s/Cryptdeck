# Cryptdeck's UI texts. Each key has every language side by side; English
# is the fallback for anything missing. To add a language, add its code
# (e.g. "fr") under every key, and in crates/cryptdeck-core/locales/core.yml.
# Placeholders like %{name} must be kept as they are.
_version: 2

pim_range:
  en: "PIM must be a number from 0 to %{max}"
  de: "Die PIM muss eine Zahl von 0 bis %{max} sein"
list_failed:
  en: "Couldn't list volumes: %{error}"
  de: "Die Volumes konnten nicht aufgelistet werden: %{error}"
internal_error:
  en: "Internal error: a background task crashed"
  de: "Interner Fehler: Eine Hintergrundaufgabe ist abgestürzt"

dialog.choose_volume:
  en: "Choose a VeraCrypt volume"
  de: "VeraCrypt-Volume auswählen"
dialog.add_keyfiles:
  en: "Add keyfiles"
  de: "Schlüsseldateien hinzufügen"
dialog.choose_folder:
  en: "Choose where to unlock the volume"
  de: "Ordner zum Entsperren auswählen"

notice.unlocked:
  en: "“%{name}” is unlocked"
  de: "„%{name}“ ist entsperrt"
notice.locked:
  en: "“%{name}” is locked"
  de: "„%{name}“ ist gesperrt"
notice.all_locked:
  en: "All volumes are locked"
  de: "Alle Volumes sind gesperrt"
notice.lock_failed:
  en: "Couldn't lock “%{name}”: %{error}"
  de: "„%{name}“ konnte nicht gesperrt werden: %{error}"
notice.open_failed:
  en: "Couldn't open %{path}: %{error}"
  de: "%{path} konnte nicht geöffnet werden: %{error}"
notice.browser_failed:
  en: "Couldn't open your browser (%{error}). Visit %{url}"
  de: "Der Browser konnte nicht geöffnet werden (%{error}). Besuchen Sie %{url}"
notice.autolock_failed:
  en: "Tried to lock your volumes automatically, but: %{error}"
  de: "Die Volumes sollten automatisch gesperrt werden, aber: %{error}"
notice.is_folder:
  en: "“%{name}” is a folder. Choose the VeraCrypt volume file instead."
  de: "„%{name}“ ist ein Ordner. Wählen Sie stattdessen die Datei des VeraCrypt-Volumes."
notice.settings_save_failed:
  en: "Couldn't save your settings: %{error}"
  de: "Die Einstellungen konnten nicht gespeichert werden: %{error}"
notice.list_save_failed:
  en: "Couldn't save your volume list: %{error}"
  de: "Die Volume-Liste konnte nicht gespeichert werden: %{error}"
dismiss:
  en: "Dismiss"
  de: "Schließen"

drop.title:
  en: "Drop to add this volume"
  de: "Loslassen, um dieses Volume hinzuzufügen"
drop.body:
  en: "Cryptdeck will remember it, and ask for its password."
  de: "Cryptdeck merkt es sich und fragt nach seinem Passwort."

header.checking:
  en: "Checking…"
  de: "Wird geprüft…"
header.settings:
  en: "Settings"
  de: "Einstellungen"
header.close_settings:
  en: "Close settings"
  de: "Einstellungen schließen"

settings.autolock:
  en: "Automatic locking"
  de: "Automatisches Sperren"
settings.on_sleep:
  en: "Lock all volumes when the computer goes to sleep"
  de: "Alle Volumes sperren, wenn der Computer in den Ruhezustand geht"
settings.on_screen_lock:
  en: "Lock all volumes when the screen locks"
  de: "Alle Volumes sperren, wenn der Bildschirm gesperrt wird"
settings.open_files:
  en: "Volumes with files still open can't be locked. If that happens, Cryptdeck tells you."
  de: "Volumes mit noch geöffneten Dateien können nicht gesperrt werden. Cryptdeck sagt Ihnen dann Bescheid."
settings.no_screen_lock:
  en: "Your system doesn't report screen locks, so that option isn't available."
  de: "Ihr System meldet keine Bildschirmsperre, daher ist diese Option nicht verfügbar."
settings.unavailable:
  en: "Automatic locking isn't available on this system."
  de: "Automatisches Sperren ist auf diesem System nicht verfügbar."

banner.missing.title:
  en: "VeraCrypt is needed"
  de: "VeraCrypt wird benötigt"
banner.missing.body:
  en: "Cryptdeck uses VeraCrypt to unlock volumes, and it doesn't seem to be installed. Install it, then choose Check again."
  de: "Cryptdeck entsperrt Volumes mit VeraCrypt, und VeraCrypt scheint nicht installiert zu sein. Installieren Sie es und wählen Sie dann „Erneut prüfen“."
banner.broken.title:
  en: "VeraCrypt isn't working"
  de: "VeraCrypt funktioniert nicht"
banner.get:
  en: "Get VeraCrypt"
  de: "VeraCrypt herunterladen"
banner.check_again:
  en: "Check again"
  de: "Erneut prüfen"

list.title:
