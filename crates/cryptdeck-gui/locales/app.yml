  de: "Fügen Sie ein VeraCrypt-Volume hinzu, um loszulegen. Sie können eine Volume-Datei auch auf dieses Fenster ziehen."
add_volume:
  en: "Add volume…"
  de: "Volume hinzufügen…"
footer.drag:
