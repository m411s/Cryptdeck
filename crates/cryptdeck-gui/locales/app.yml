footer.stay_unlocked:
  en: "Unlocked volumes stay unlocked until you lock them, even after you close Cryptdeck."
  de: "Entsperrte Volumes bleiben entsperrt, bis Sie sie sperren – auch wenn Sie Cryptdeck schließen."
footer.tray:
  en: "Unlocked volumes stay unlocked until you lock them. Closing this window keeps Cryptdeck in the system tray."
  de: "Entsperrte Volumes bleiben entsperrt, bis Sie sie sperren. Wenn Sie dieses Fenster schließen, bleibt Cryptdeck im Infobereich."
lock_all:
  en: "Lock all"
  de: "Alle sperren"

