[package]
name = "cryptdeck"
description = "A cross-platform desktop GUI for VeraCrypt volumes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cryptdeck"
path = "src/main.rs"

[dependencies]
cryptdeck-core.workspace = true
secrecy.workspace = true
zeroize.workspace = true
iced = "0.14"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# System tray over D-Bus (StatusNotifierItem); no GTK needed.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# systemd-logind over D-Bus, for locking on sleep and screen lock.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
winresource = "0.1"
